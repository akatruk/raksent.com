global:
  scrape_interval: 30s
  scrape_timeout: 10s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: raksent_health
    metrics_path: /probe
    params:
      module: [raksent_health]
    static_configs:
      - targets: ['http://website:8080/readyz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox:9115'
